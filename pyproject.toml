[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]



[project]
name = "spimpack"
dynamic = ["version"]
description = "SPIM dataset packaging/publishing tool with pluggable backends"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Khan Lab"}]
# Runtime dependencies for pip/uv installs; keep in step with [tool.pixi.package.run-dependencies] below.
# tk (the UI's file dialogs) comes with Python itself outside conda.
dependencies = [
    "pyyaml>=6.0.3,<7",
    "pybids>=0.22.0,<0.23",
    "streamlit>=1.58.0,<2",
    "pandas>=3.0.3,<4",
    "starlette>=0.47,<1.4",
    "zarrnii>=0.22.0,<0.23",
]

[project.optional-dependencies]
# validates the ingest manifest the mind backend writes; installed from the MIND server repository
mind = ["mind-ingest"]


[project.scripts]
spimpack = "spimpack.cli:main"
spimpack-ui = "spimpack.ui.launcher:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = "^v(?P<version>.+)$"
fallback_version = "0.0.0.dev0"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.pixi.workspace]
channels = ["conda-forge", "https://prefix.dev/akhanf/khanlab"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.environments]
default = { solve-group = "default" }


[tool.pixi.package]
name = "spimpack"
# set from the release tag by the publish workflow
version = "0.0.0.dev0"
publish = true

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.package.host-dependencies]
hatchling = "*"
hatch-vcs = "*"

[tool.pixi.dependencies]
spimpack = { path = "." }

[tool.pixi.package.run-dependencies]
tk = ">=8.6.13,<9"
pyyaml = ">=6.0.3,<7"
pybids = ">=0.22.0,<0.23"
streamlit = ">=1.58.0,<2"
pandas = ">=3.0.3,<4"
starlette = ">=0.47,<1.4"
zarrnii = ">=0.22.0,<0.23"
